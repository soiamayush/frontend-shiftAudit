name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      DEPLOY_DIR: /opt/shiftaudit/frontend
      NEXT_PUBLIC_BACKEND_URL: https://shiftaudit.in/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync build to deploy dir
        run: |
          set -e
          sudo mkdir -p "$DEPLOY_DIR"
          sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./.next/standalone/ "$DEPLOY_DIR/"
          sudo mkdir -p "$DEPLOY_DIR/.next"
          sudo rsync -a --delete ./.next/static/ "$DEPLOY_DIR/.next/static/"
          sudo rsync -a --delete ./public/ "$DEPLOY_DIR/public/"
          sudo chown -R ubuntu:ubuntu "$DEPLOY_DIR"

      - name: Restart systemd service
        run: |
          sudo systemctl restart shiftaudit-frontend
          sleep 2
          sudo systemctl status shiftaudit-frontend --no-pager | head -20

      - name: Free disk space
        if: always()
        run: |
          rm -rf node_modules .next
          npm cache clean --force 2>/dev/null || true
          sudo find /opt/shiftaudit -maxdepth 4 -type f \( -name '*.tar' -o -name '*.tar.gz' \) -delete 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          docker builder prune -af --keep-storage 1gb 2>/dev/null || true
